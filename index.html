    <!-- Coin-flip colour scheme, fresh on every load. Runs here in <head>, not
         in React: deciding after hydration would paint the dark theme first and
         visibly flash before flipping to light. -->

      if (Math.random() < 0.5) document.documentElement.classList.add("light");
    </script>
